<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="timer" aria-live="polite">00:00</div>
  <div id="sudoku-board"></div>
  <div class="controls">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
      <span class="theme-toggle__label">Dark Mode</span>
      <span class="theme-toggle__state">Off</span>
    </button>
    <label class="difficulty-control" for="difficulty-select">Difficulty</label>
    <select id="difficulty-select" aria-label="Select game difficulty">
      <option value="Easy">Easy</option>
      <option value="Medium" selected>Medium</option>
      <option value="Hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="hint-solution">Hint</button>
    <button id="check-solution">Check Puzzle</button>
    <span id="message"></span>
  </div>
  <div id="score-entry" hidden>
    <label for="player-name">Enter your name for the leaderboard:</label>
    <input id="player-name" type="text" maxlength="30" autocomplete="off">
    <button id="save-score">Save Score</button>
    <div id="score-entry-message" aria-live="polite"></div>
  </div>
  <section id="leaderboard" aria-labelledby="leaderboard-title">
    <h2 id="leaderboard-title">Top 10 Leaderboard</h2>
    <table class="leaderboard-table">
      <thead>
        <tr>
          <th scope="col">Rank</th>
          <th scope="col">Player</th>
          <th scope="col">Time</th>
          <th scope="col">Hints</th>
          <th scope="col">Difficulty</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr>
          <td colspan="5">Loading scores…</td>
        </tr>
      </tbody>
    </table>
  </section>
  <script src="/static/main.js"></script>
</body>
</html>
